name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oodiff

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Require compiler and clang
        working-directory: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }

      - name: Build oodar libs
        working-directory: ${{ github.workspace }}
        run: make -C oodar/scripts -f Makefile modular

      - name: Build, verify, test, and check parity
        working-directory: ${{ github.workspace }}/oodiff
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: |
          make verify
          make build
          make test
          make parity

      - name: Verify packaging (.deb & .rpm)
        working-directory: ${{ github.workspace }}/oodiff
        run: |
          sudo apt-get install -y -qq rpm
          make package-deb
          make package-rpm
          ls -la dist/*.deb dist/*.rpm
          sudo dpkg -i dist/oodiff_*_amd64.deb
          /usr/bin/oodiff --version
          /usr/bin/oodiff qa/fixtures/test_a.txt qa/fixtures/test_a.txt
          /usr/bin/oodiff qa/fixtures/test_a.txt qa/fixtures/test_b.txt >/dev/null 2>&1 || test $? -eq 1
